<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ortak Karar Forumu v2.5</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f4f6f4;--sf:#ffffff;--ink:#14231b;--mu:#53645b;--ac:#0b6650;
      --no:#bd215b;--ln:#d2ded6;--hl:#e4f0ea;--warn:#c88300;--card-shadow:0 2px 8px rgba(0,0,0,0.04);
      box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
    }
    @media(prefers-color-scheme:dark){
      :root:not([data-theme="light"]){
        --bg:#0e1713;--sf:#15221c;--ink:#e4eee8;--mu:#92a49b;--ac:#41c7a1;
        --no:#f26896;--ln:#26372f;--hl:#193026;--warn:#e6a117;--card-shadow:0 2px 8px rgba(0,0,0,0.25)
      }
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Source Sans 3",system-ui,sans-serif}
    h1,h2,h3,h4{font-family:"Bricolage Grotesque",Georgia,sans-serif;line-height:1.2;margin:.2em 0 .4em}
    h1{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:800;letter-spacing:-.02em}
    h2{font-size:1.3rem;font-weight:700}h3{font-size:1.05rem;font-weight:600}
    main{max-width:960px;margin:0 auto;padding:16px}
    .chain{display:flex;gap:3px;flex-wrap:wrap;margin:10px 0 6px}
    .chain i{width:13px;height:13px;border-radius:3px;display:block;transition:transform .1s}
    .chain i:hover{transform:scale(1.4)}
    nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0;border-bottom:2px solid var(--ln);margin-bottom:16px}
    nav button{white-space:nowrap;font-weight:600;font-size:.92rem}
    button,select,input,textarea{font:inherit;color:inherit}
    button{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:7px 13px;cursor:pointer;transition:all .15s}
    button:hover{border-color:var(--ac);background:var(--hl)}
    button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
    button.pri:hover{filter:brightness(1.1)}
    button.no{border-color:var(--no);color:var(--no)}button.no:hover{background:var(--no);color:#fff}
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
    input,select,textarea{width:100%;background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:9px;margin:4px 0 10px}
    label{font-size:.88rem;color:var(--mu);font-weight:600}
    .card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:var(--card-shadow)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
    .stat b{font:800 1.7rem "Bricolage Grotesque",sans-serif;display:block;color:var(--ac)}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .mu{color:var(--mu);font-size:.88rem}
    .tag{font-size:.78rem;font-weight:600;border:1px solid var(--ln);border-radius:20px;padding:2px 9px;background:var(--hl);color:var(--ink)}
    .tag-ai{background:#2b1b4a;color:#d8b4fe;border-color:#6b21a8}
    .tag-exp{background:#1e3a5f;color:#93c5fd;border-color:#2563eb}
    .tag-ok{background:#064e3b;color:#a7f3d0;border-color:#059669}
    .tag-no{background:#4c0519;color:#fecdd3;border-color:#e11d48}
    .bar{height:10px;border-radius:5px;background:var(--ln);overflow:hidden;display:flex;margin:8px 0}
    .bar span{display:block;height:100%}
    .msg{border-left:4px solid var(--ac);background:var(--hl);padding:10px 14px;margin-bottom:14px;border-radius:0 8px 8px 0;font-weight:600}
    .part{border-left:3px solid var(--ac);padding:6px 12px;margin:10px 0;background:rgba(0,0,0,0.015);border-radius:0 6px 6px 0}
    .part.h{opacity:.45;border-color:var(--no);text-decoration:line-through}
    .ind{margin-left:calc(var(--d)*18px)}
    code{font-size:.8rem;word-break:break-all;background:rgba(0,0,0,0.05);padding:2px 4px;border-radius:4px}
    .scroll{overflow-x:auto}
  </style>
</head>
<body>
<main id="app"></main>

<script>
var $ = function(s){ return document.querySelector(s); };
var esc = function(t){
  return String(t === null || t === undefined ? '' : t)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
};

var KEY = 'forum_v25_seed';
var SESS = 'forum_v25_user';
var uid = function(){ return Math.random().toString(36).slice(2, 9); };

var S;
var me = null;
var tab = 'acc';
var open = null;
var msg = [];
var showH = false;

var TABS = {
  acc: 'Hesap ve Giris',
  panel: 'Deshpord',
  topics: 'Konular',
  props: 'Oylamalar',
  deleg: 'Delegasyon Grafi',
  ledger: 'Dagitik Defter',
  rules: 'Kurallar'
};

var RULES = [
  'Hicbir kayit gercekten silinmez; yalnizca gizlenir ve defterde kalir.',
  'Sistemdeki her degisiklik oylamayla yapilir.',
  'Esit oy hakki: 1 uye = 1 oy. Bilirkisi/YZ = 10 puan.',
  'Azinlik korumasi: Tek bir guc odagi toplam oyun %20sini asamaz.',
  'Silme, gizleme ve kapatma 2/3 nitelikli cogunluk ister. Digerleri 1/2 basit cogunluk. Katilim baraji %25tir.',
  'Tum islemler SHA-256 zinciriyle dagitik deftere yazilir.'
];

var REG = [
  'm.1 Degismez kurallara aykiri oneri reddedilir.',
  'm.2 Hakaret ve argo iceren dil kullanilamaz.',
  'm.3 Baslik 5-80, konu metni 20-600, ek metin 10-600 karakter olmalidir.',
  'm.4 Kullanici basina en fazla 3 aktif oneri limiti.',
  'm.5 Jaccard Benzerlik: Mevcut konulara %60+ benzer baslik acilamaz.',
  'm.6 Yetki Denetimi: Yalnizca ilgili alanin uyeleri oy verebilir.'
];

var THR = { create: 0.5, edit: 0.5, delPart: 0.66, delete: 0.66, close: 0.66, field: 0.5 };

async function sha(t){
  try {
    var b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
    return Array.from(new Uint8Array(b)).map(function(x){ return x.toString(16).padStart(2, '0'); }).join('');
  } catch(e) {
    var h = 0;
    for(var i = 0; i < t.length; i++){
      h = (h * 31 + t.charCodeAt(i)) | 0;
    }
    return 'x' + (h >>> 0).toString(16);
  }
}

function save(){
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
    if(me){
      localStorage.setItem(SESS, me.id);
    } else {
      localStorage.removeItem(SESS);
    }
  } catch(e){}
}

async function log(a, d){
  var p = S.ledger.length > 0 ? S.ledger[S.ledger.length - 1].h : '0';
  var e = { n: S.ledger.length, t: new Date().toISOString(), a: a, d: d, p: p };
  e.h = await sha(p + e.t + a + JSON.stringify(d));
  S.ledger.push(e);
}

var anc = function(id){
  var r = [];
  var n = S.onto.find(function(o){ return o.id === id; });
  while(n){
    r.push(n.id);
    n = S.onto.find(function(o){ return o.id === n.p; });
  }
  return r;
};

var inSub = function(node, root){
  return anc(node).includes(root);
};

var on = function(id){
  var found = S.onto.find(function(o){ return o.id === id; });
  return found ? found.n : '?';
};

var elig = function(u, t){
  if(!t.field){ return !u.exp; }
  if(u.exp){ return inSub(t.field, u.exp) || inSub(u.exp, t.field); }
  return u.int.some(function(i){ return inSub(i, t.field); });
};

var byId = function(id){
  return S.users.find(function(u){ return u.id === id; });
};

var tp = function(id){
  return S.topics.find(function(t){ return t.id === id; });
};

var vis = function(t){
  return showH || (!t.hidden && (!t.parent || vis(tp(t.parent))));
};

var ptopic = function(p){
  if(p.type === 'create'){ return { field: p.pl.field }; }
  if(p.type === 'field'){ return { field: p.pl.parent || null }; }
  return tp(p.pl.tid);
};

function tally(p){
  var t = ptopic(p);
  var el = S.users.filter(function(u){ return elig(u, t); });
  var total = el.reduce(function(s, u){ return s + (u.exp ? 10 : 1); }, 0) || 1;
  var cap = Math.max(10, total * 0.20);
  var bal = {};

  var add = function(k, v, w){
    bal[k] = bal[k] || { v: v, w: 0 };
    bal[k].w += w;
  };

  el.forEach(function(u){
    var v = p.votes[u.id];
    if(v){
      add(u.id, v, u.exp ? 10 : 1);
    } else {
      var d = S.deleg.find(function(g){ return g.from === u.id && inSub(t.field, g.field); });
      if(d && p.votes[d.to]){
        add(d.to, p.votes[d.to], 1);
      }
    }
  });

  var y = 0;
  var n = 0;
  Object.keys(bal).forEach(function(k){
    var b = bal[k];
    var w = Math.min(b.w, cap);
    if(b.v === 'e'){ y += w; } else { n += w; }
  });

  var P = y + n;
  var q = P >= 0.25 * total;
  var ok = P > 0 && (y / P) > THR[p.type];
  return { y: y, n: n, P: P, total: total, cap: cap, q: q, ok: ok };
}

var W = function(t){
  return new Set(t.toLowerCase().split(/[^a-z0-9]+/).filter(function(x){ return x.length > 2; }));
};

var sim = function(a, b){
  var wa = W(a);
  var wb = W(b);
  var inter = Array.from(wa).filter(function(x){ return wb.has(x); }).length;
  var union = (wa.size + wb.size - inter) || 1;
  return inter / union;
};

function check(type, pl){
  var e = [];
  var txt = (pl.title || '') + ' ' + (pl.body || '');
  if(!me){ return ['Once oturum acmalisiniz.']; }
  if(type === 'create' && (pl.title.length < 5 || pl.title.length > 80)){ e.push('m.3 Baslik 5-80 karakter olmalidir.'); }
  if(type === 'field' && (pl.title.length < 2 || pl.title.length > 30)){ e.push('m.3 Alan adi 2-30 karakter olmalidir.'); }
  if(type === 'field' && S.onto.some(function(o){ return o.n.toLowerCase() === pl.title.toLowerCase(); })){ e.push('m.5 Bu alan zaten tanimli.'); }
  if((type === 'create' && pl.body.length < 20) || (type === 'edit' && pl.body.length < 10)){ e.push('m.3 Gerekce metni cok kisa.'); }
  if((pl.body || '').length > 600){ e.push('m.3 Metin 600 karakteri asamaz.'); }
  if(/aptal|salak|gerizekal|ahmak/i.test(txt)){ e.push('m.2 Hakaret iceren dil kullanilamaz.'); }
  if(/kalici\s*sil|fiziksel\s*sil/i.test(txt)){ e.push('m.1 Degismez kurallara aykiri oneri.'); }
  if(S.props.filter(function(p){ return p.by === me.id && p.st === 'acik'; }).length >= 3){ e.push('m.4 En fazla 3 acik oneri bulunabilir.'); }
  if(type === 'create'){
    var d = S.topics.find(function(t){ return !t.hidden && sim(t.title, pl.title) >= 0.6; });
    if(d){ e.push('m.5 Benzer konu var: ' + d.title); }
  }
  var f = pl.field || (tp(pl.tid) ? tp(pl.tid).field : null);
  if(f && !elig(me, { field: f })){ e.push('m.6 Bu alanin uyesi degilsiniz.'); }
  if(pl.tid && tp(pl.tid) && tp(pl.tid).status === 'kapali'){ e.push('Bu konu kapatilmistir.'); }
  return e;
}

async function runAiAgentEvaluator(p){
  var t = ptopic(p);
  if(t && (inSub(t.field, 'fb') || inSub(t.field, 'spor'))){
    var ai = S.users.find(function(u){ return u.id === 'e2'; });
    if(ai && !p.votes[ai.id]){
      var txt = ((p.pl.title || '') + ' ' + (p.pl.body || '')).toLowerCase();
      var voteVal = txt.includes('iptal') ? 'h' : 'e';
      p.votes[ai.id] = voteVal;
      await log('oy', { p: p.id, by: ai.nick, v: voteVal, note: 'Claude Otonom Oy' });
      return true;
    }
  }
  return false;
}

async function propose(type, pl){
  var e = check(type, pl);
  if(e.length){ msg = e; render(); return; }
  var p = { id: uid(), type: type, pl: pl, by: me.id, votes: {}, st: 'acik', t: Date.now() };
  S.props.push(p);
  await log('oneri:' + type, { p: p.id, by: me.nick, tid: pl.tid || null });
  var aiDid = await runAiAgentEvaluator(p);
  save();
  msg = ['Oneri oylamaya sunuldu.' + (aiDid ? ' Claude Futbol-YZ otonom oy kullandi.' : '')];
  tab = 'props';
  render();
}

var desc = function(p){
  if(p.type === 'field'){ return 'Alan Teklifi: ' + (p.pl.title || ''); }
  if(p.type === 'create'){ return 'Yeni Konu: ' + (p.pl.title || ''); }
  if(p.type === 'edit'){ return 'Karar Metni Degisikligi'; }
  if(p.type === 'delPart'){ return 'Metin Parcasi Gizleme'; }
  if(p.type === 'delete'){ return 'Konunun Arsivlenmesi'; }
  if(p.type === 'close'){ return 'Konunun Kapatilmasi'; }
  return 'Oneri';
};

async function vote(id, v){
  var p = S.props.find(function(x){ return x.id === id; });
  if(!me || !p || p.st !== 'acik' || !elig(me, ptopic(p))){ return; }
  p.votes[me.id] = v;
  await log('oy', { p: id, by: me.nick, v: v });
  save();
  render();
}

async function fin(id, silent){
  var p = S.props.find(function(x){ return x.id === id; });
  var r = tally(p);
  if(!r.q){
    if(!silent){ msg = ['Katilim baraji asilmadi.']; render(); }
    return r;
  }
  p.st = r.ok ? 'kabul' : 'ret';
  var pl = p.pl;
  if(r.ok){
    if(p.type === 'field'){ S.onto.push({ id: uid(), n: pl.title, p: pl.parent || null }); }
    if(p.type === 'create'){ S.topics.push({ id: uid(), title: pl.title, parent: pl.parent || null, field: pl.field, status: 'acik', hidden: false, by: p.by, parts: [{ id: uid(), t: pl.body, by: p.by, hidden: false }] }); }
    var t = tp(pl.tid);
    if(t){
      if(p.type === 'edit'){ t.parts.push({ id: uid(), t: pl.body, by: p.by, hidden: false }); }
      if(p.type === 'delPart'){
        var foundPart = t.parts.find(function(x){ return x.id === pl.part; });
        if(foundPart){ foundPart.hidden = true; }
      }
      if(p.type === 'delete'){ t.hidden = true; }
      if(p.type === 'close'){ t.status = 'kapali'; }
    }
  }
  await log('sonuc', { p: id, st: p.st, y: r.y, n: r.n });
  save();
  if(!silent){ msg = ['Oylama Sonuclandi: ' + (r.ok ? 'KABUL EDILDI' : 'REDDEDILDI')]; render(); }
  return r;
}

async function reg(){
  var g = function(i){ return $('#' + i).value.trim(); };
  var intEls = Array.from(document.querySelectorAll('.ii:checked'));
  var intArr = intEls.map(function(x){ return x.value; });
  if(g('rd') && !intArr.includes('diger')){ intArr.push('diger'); }

  var e = [];
  ['rn', 'rs', 'rb', 'ra', 'rk'].forEach(function(i){
    if(!g(i)){ e.push('Tum alanlar zorunludur.'); }
  });
  if($('#rp').value.length < 8){ e.push('Sifre en az 8 karakter olmalidir.'); }
  if(S.users.some(function(u){ return u.nick.toLowerCase() === g('rk').toLowerCase(); })){ e.push('Bu takma ad kayitli.'); }
  if(intArr.length < 3){ e.push('En az 3 ilgi alani seciniz.'); }
  if(e.length){ msg = Array.from(new Set(e)); render(); return; }

  var salt = uid();
  var u = {
    id: uid(),
    name: g('rn'),
    sur: g('rs'),
    birth: g('rb'),
    addr: g('ra'),
    nick: g('rk'),
    salt: salt,
    ph: await sha(salt + $('#rp').value),
    int: intArr,
    other: g('rd')
  };
  S.users.push(u);
  me = u;
  await log('kayit', { nick: u.nick });
  save();
  msg = ['Kayit basarili: @' + u.nick];
  tab = 'topics';
  render();
}

async function login(){
  var nickInput = $('#ln').value.trim();
  var u = S.users.find(function(x){ return x.nick === nickInput; });
  if(!u || !u.ph || u.ph !== await sha(u.salt + $('#lp').value)){
    msg = ['Hatali giris.']; render(); return;
  }
  me = u;
  msg = ['Giris yapildi: @' + u.nick];
  tab = 'topics';
  save();
  render();
}

function loginAs(id){
  me = byId(id);
  msg = ['Aktif: @' + me.nick];
  save();
  render();
}

function logout(){
  me = null;
  save();
  msg = ['Cikis yapildi.'];
  tab = 'acc';
  render();
}

async function assign(){
  if(!me){ return; }
  var f = $('#df').value;
  var to = $('#dt').value;
  S.deleg = S.deleg.filter(function(g){ return !(g.from === me.id && g.field === f); });
  S.deleg.push({ from: me.id, to: to, field: f });
  await log('delegasyon', { from: me.nick, to: byId(to).nick, field: f });
  save();
  msg = ['Oy devredildi.'];
  render();
}

async function newTopicFlex(){
  var parentId = $('#np').value || null;
  var customParent = $('#ncp').value.trim();
  var f = $('#nf').value;

  if(customParent){
    var existing = S.topics.find(function(t){ return t.title.toLowerCase() === customParent.toLowerCase(); });
    if(!existing){
      existing = {
        id: uid(),
        title: customParent,
        parent: null,
        field: f,
        status: 'acik',
        hidden: false,
        by: me.id,
        parts: [{ id: uid(), t: 'Kullanici kategorisi.', by: me.id, hidden: false }]
      };
      S.topics.push(existing);
      await log('ust-konu', { id: existing.id, title: existing.title });
    }
    parentId = existing.id;
  }
  await propose('create', { title: $('#nt').value.trim(), body: $('#nb').value.trim(), parent: parentId, field: f });
}

async function domino(){
  var userNicks = ['nijat', 'osman', 'revan', 'maqa'];
  var U = userNicks.map(function(n){ return S.users.find(function(u){ return u.nick === n; }); });
  var prev = me;
  me = U[0];
  var pl = { title: 'Bahar Donemi Domino Turnuvasi', body: 'Kampus domino ve akil oyunlari etkinligi.', parent: 't5', field: 'oyun' };
  var p = { id: uid(), type: 'create', pl: pl, by: me.id, votes: {}, st: 'acik', t: Date.now() };
  S.props.push(p);
  await log('oneri:create', { p: p.id, by: me.nick });

  var out = [];
  for(var i = 0; i < U.length; i++){
    var u = U[i];
    var v = Math.random() < 0.3 ? 'h' : 'e';
    p.votes[u.id] = v;
    await log('oy', { p: p.id, by: u.nick, v: v });
    out.push(u.nick + ': ' + (v === 'e' ? 'evet' : 'hayir'));
  }
  await fin(p.id, true);
  me = prev;
  save();
  msg = ['Domino Testi: ' + out.join(' · '), 'Sonuc: ' + (p.st === 'kabul' ? 'KABUL' : 'RET')];
  tab = 'props';
  render();
}

async function verify(){
  var p = '0';
  var ok = true;
  for(var i = 0; i < S.ledger.length; i++){
    var e = S.ledger[i];
    var computed = await sha(p + e.t + e.a + JSON.stringify(e.d));
    if(e.p !== p || e.h !== computed){
      ok = false;
      break;
    }
    p = e.h;
  }
  msg = [ok ? 'Dagitik Defter Dogrulandi: ' + S.ledger.length + ' blok, zincir BUTUN.' : 'UYARI: Defter bozulmus!'];
  render();
}

var opts = function(a, sel){
  return a.map(function(pair){
    var v = pair[0];
    var l = pair[1];
    return '<option value="' + esc(v) + '"' + (v === sel ? ' selected' : '') + '>' + esc(l) + '</option>';
  }).join('');
};

var ontoOpts = function(sel){
  var list = S.onto.map(function(o){
    var level = anc(o.id).length - 1;
    var prefix = '';
    for(var i = 0; i < level; i++){ prefix += '- '; }
    return [o.id, prefix + o.n];
  });
  return opts(list, sel);
};

function bar(r){
  var t = r.y + r.n || 1;
  return '<div class="bar"><span style="width:' + (r.y / t * 100) + '%;background:var(--ac)"></span><span style="width:' + (r.n / t * 100) + '%;background:var(--no)"></span></div>';
}

function tree(parent, d){
  var filtered = S.topics.filter(function(t){ return (t.parent || null) === parent && vis(t); });
  return filtered.map(function(t){
    var n = S.props.filter(function(p){ return p.st === 'acik' && p.pl.tid === t.id; }).length;
    var badge = n ? '<span class="tag tag-ok">' + n + ' Oylama</span>' : '';
    var closedTag = t.status === 'kapali' ? '<span class="tag tag-no">kapali</span>' : '';
    var hiddenTag = t.hidden ? '<span class="tag">arsivlendi</span>' : '';
    return '<div class="card ind" style="--d:' + d + '">' +
      '<div class="row">' +
        '<button onclick="open=\'' + t.id + '\';render()"><b>' + esc(t.title) + '</b></button>' +
        '<span class="tag">' + esc(on(t.field)) + '</span>' +
        closedTag + hiddenTag + badge +
      '</div>' +
    '</div>' + tree(t.id, d + 1);
  }).join('');
}

function detail(t){
  var can = me && elig(me, t) && t.status === 'acik';
  var partsHtml = t.parts.filter(function(p){ return showH || !p.hidden; }).map(function(p){
    var author = byId(p.by);
    var authorNick = author ? author.nick : 'anonim';
    var delBtn = (can && !p.hidden) ? '<button style="margin-top:4px" onclick="propose(\'delPart\',{tid:\'' + t.id + '\',part:\'' + p.id + '\'})">Gizlemeyi Oyla</button>' : '';
    return '<div class="part ' + (p.hidden ? 'h' : '') + '">' +
      esc(p.t) +
      '<div class="mu">Yazar: @' + esc(authorNick) + ' ' + (p.hidden ? '(Gizlendi)' : '') + '</div>' +
      delBtn +
    '</div>';
  }).join('');

  var actionsHtml = can ? (
    '<div class="card">' +
      '<h3>Ek Karar Metni Oner</h3>' +
      '<textarea id="eb" rows="3"></textarea>' +
      '<div class="row">' +
        '<button class="pri" onclick="propose(\'edit\',{tid:\'' + t.id + '\',body:$(\'#eb\').value.trim()})">Eklemeyi Oyla</button>' +
        '<button class="no" onclick="propose(\'close\',{tid:\'' + t.id + '\'})">Kapatmayi Oyla</button>' +
        '<button class="no" onclick="propose(\'delete\',{tid:\'' + t.id + '\'})">Arsivlemeyi Oyla</button>' +
      '</div>' +
    '</div>' +
    '<div class="card">' +
      '<h3>Yeni Alt Konu Ac</h3>' +
      '<label for="st">Baslik</label><input id="st">' +
      '<label for="sf">Alan</label><select id="sf">' + ontoOpts(t.field) + '</select>' +
      '<label for="sb">Gerekce</label><textarea id="sb" rows="2"></textarea>' +
      '<button class="pri" onclick="propose(\'create\',{title:$(\'#st\').value.trim(),body:$(\'#sb\').value.trim(),parent:\'' + t.id + '\',field:$(\'#sf\').value})">Alt Konuyu Oyla</button>' +
    '</div>'
  ) : '<p class="mu">Oneri yapmak icin ilgili alana uye olmalisiniz.</p>';

  var eligCount = S.users.filter(function(u){ return elig(u, t); }).length;
  return '<button onclick="open=null;render()">Konu Listesine Don</button>' +
    '<div class="card" style="margin-top:10px">' +
      '<h2>' + esc(t.title) + '</h2>' +
      '<div class="row">' +
        '<span class="tag">' + esc(on(t.field)) + '</span>' +
        '<span class="tag">' + t.status + '</span>' +
        '<span class="mu">Secmen: ' + eligCount + ' kisi</span>' +
      '</div>' +
    '</div>' +
    '<h3>Karar Metni</h3>' +
    partsHtml +
    actionsHtml;
}

var V = {
  acc: function(){
    var demoUsersHtml = S.users.filter(function(u){ return u.demo; }).map(function(u){
      var isMe = me && me.id === u.id;
      return '<button class="' + (isMe ? 'pri' : '') + '" onclick="loginAs(\'' + u.id + '\')">@' + esc(u.nick) + '</button>';
    }).join('');

    var activeHtml = me ? (
      '<div class="card">' +
        '<h2>Aktif Oturum: @' + esc(me.nick) + '</h2>' +
        '<p class="mu">Ad Soyad: ' + esc(me.name + ' ' + me.sur) + ' - Oy Gucu: <b>' + (me.exp ? 10 : 1) + ' Puan</b></p>' +
        '<p class="mu">Ilgi Alanlari: ' + (me.int.map(on).join(' - ') || '-') + '</p>' +
        '<button class="no" onclick="logout()">Oturumu Kapat</button>' +
      '</div>'
    ) : (
      '<div class="grid">' +
        '<div class="card">' +
          '<h2>Giris Yap</h2>' +
          '<label for="ln">Takma Ad</label><input id="ln">' +
          '<label for="lp">Sifre</label><input id="lp" type="password">' +
          '<button class="pri" onclick="login()">Oturum Ac</button>' +
        '</div>' +
        '<div class="card">' +
          '<h2>Yeni Kayit</h2>' +
          '<div class="grid">' +
            '<div><label for="rn">Ad</label><input id="rn"></div>' +
            '<div><label for="rs">Soyad</label><input id="rs"></div>' +
          '</div>' +
          '<div class="grid">' +
            '<div><label for="rb">Dogum Tarihi</label><input id="rb" type="date" value="2001-05-15"></div>' +
            '<div><label for="rk">Takma Ad</label><input id="rk"></div>' +
          '</div>' +
          '<label for="ra">Adres</label><input id="ra">' +
          '<label for="rp">Sifre (Min 8 Karakter)</label><input id="rp" type="password" value="demo12345">' +
          '<label>Ilgi Alanlari</label>' +
          '<div class="row">' +
            S.onto.map(function(o){
              return '<label><input class="ii" style="width:auto" type="checkbox" value="' + o.id + '"> ' + esc(o.n) + '</label>';
            }).join('') +
          '</div>' +
          '<label for="rd">Diger</label><input id="rd">' +
          '<button class="pri" onclick="reg()">Kaydi Tamamla</button>' +
        '</div>' +
      '</div>'
    );

    return '<div class="card" style="border-left:4px solid var(--ac)">' +
      '<h2>Hizli Demo Girisi</h2>' +
      '<div class="row" style="margin-bottom:10px">' +
        '<button class="on" onclick="loginAs(\'e2\')">Claude (Futbol-YZ)</button>' +
        '<button class="on" onclick="loginAs(\'e1\')">Prof. Ayse (Spor)</button>' +
        '<button class="on" onclick="loginAs(\'e3\')">Dr. Tolga (Teknoloji)</button>' +
      '</div>' +
      '<div class="row" style="margin-bottom:12px">' +
        demoUsersHtml +
      '</div>' +
      '<div class="row">' +
        '<button class="pri" onclick="domino()">Domino Test Senaryosu</button>' +
        '<button onclick="try{localStorage.removeItem(KEY);localStorage.removeItem(SESS)}catch(e){};location.reload()">Verileri Sifirla</button>' +
      '</div>' +
    '</div>' + activeHtml;
  },

  panel: function(){
    var finished = S.props.filter(function(p){ return p.st !== 'acik'; });
    var accepted = finished.filter(function(p){ return p.st === 'kabul'; }).length;
    var consensusRate = finished.length > 0 ? (Math.round(accepted / finished.length * 100) + '%') : '-';

    var hotTopics = S.topics.slice().filter(vis).sort(function(x, y){
      var countX = S.props.filter(function(p){ return p.pl.tid === x.id; }).length;
      var countY = S.props.filter(function(p){ return p.pl.tid === y.id; }).length;
      return countY - countX;
    }).slice(0, 5);

    var hotHtml = hotTopics.map(function(t){
      return '<div class="card row" style="justify-content:space-between">' +
        '<div><b>' + esc(t.title) + '</b> <span class="tag">' + esc(on(t.field)) + '</span></div>' +
        '<button onclick="tab=\'topics\';open=\'' + t.id + '\';render()">Goruntule</button>' +
      '</div>';
    }).join('');

    return '<div class="grid">' +
      '<div class="card stat"><b>' + S.users.length + '</b>Secmen</div>' +
      '<div class="card stat"><b>' + S.topics.filter(vis).length + '</b>Konu</div>' +
      '<div class="card stat"><b>' + S.props.filter(function(p){ return p.st === 'acik'; }).length + '</b>Acik Oylama</div>' +
      '<div class="card stat"><b>' + consensusRate + '</b>Kabul Orani</div>' +
      '<div class="card stat"><b>' + S.ledger.length + '</b>Blok</div>' +
    '</div>' +
    '<h2>Hareketli Konular</h2>' +
    hotHtml;
  },

  topics: function(){
    if(open && tp(open)){ return detail(tp(open)); }
    var existingTopicOptions = opts(S.topics.filter(vis).map(function(t){ return [t.id, t.title]; }));

    return '<div class="row" style="justify-content:space-between;margin-bottom:10px">' +
      '<h2>Konu Agaci</h2>' +
      '<label><input type="checkbox" style="width:auto" ' + (showH ? 'checked' : '') + ' onchange="showH=this.checked;render()"> Arsivlenenleri Goster</label>' +
    '</div>' +
    tree(null, 0) +
    '<div class="card">' +
      '<h3>Yeni Konu / Alt Konu Baslat</h3>' +
      '<label for="nt">Konu Basligi</label><input id="nt">' +
      '<div class="grid">' +
        '<div>' +
          '<label for="np">Ust Konu Sec</label>' +
          '<select id="np"><option value="">(Ana Konu)</option>' + existingTopicOptions + '</select>' +
        '</div>' +
        '<div>' +
          '<label for="ncp">Veya Yeni Ust Konu Belirt</label>' +
          '<input id="ncp">' +
        '</div>' +
      '</div>' +
      '<label for="nf">Yetki Alani</label><select id="nf">' + ontoOpts() + '</select>' +
      '<label for="nb">Gerekce Metni</label><textarea id="nb" rows="3"></textarea>' +
      '<button class="pri" onclick="newTopicFlex()">Oylamaya Sun</button>' +
    '</div>';
  },

  props: function(){
    var reversedProps = S.props.slice().reverse();
    var propsHtml = reversedProps.map(function(p){
      var r = tally(p);
      var t = ptopic(p);
      var can = me && p.st === 'acik' && elig(me, t);
      var myVote = me ? p.votes[me.id] : null;

      var tagClass = p.st === 'kabul' ? 'tag-ok' : (p.st === 'ret' ? 'tag-no' : '');
      var requiredRatio = p.type.indexOf('del') !== -1 || p.type.indexOf('close') !== -1 ? '2/3' : '1/2';
      var author = byId(p.by);
      var authorNick = author ? author.nick : 'anonim';

      var voteControls = '';
      if(p.st === 'acik'){
        var buttons = can ? (
          '<button class="pri" onclick="vote(\'' + p.id + '\',\'e\')">Kabul</button>' +
          '<button class="no" onclick="vote(\'' + p.id + '\',\'h\')">Ret</button>'
        ) : '<span class="mu">Oy yetkiniz yok.</span>';

        var myBadge = myVote ? '<span class="tag tag-ok">Oyunuz: ' + (myVote === 'e' ? 'KABUL' : 'RET') + '</span>' : '';
        var finalizeBtn = can ? '<button style="margin-left:auto" onclick="fin(\'' + p.id + '\')">Sureyi Bitir</button>' : '';

        voteControls = '<div class="row" style="margin-top:10px">' + buttons + myBadge + finalizeBtn + '</div>';
      }

      return '<div class="card">' +
        '<div class="row" style="justify-content:space-between">' +
          '<b>' + desc(p) + '</b>' +
          '<div>' +
            '<span class="tag ' + tagClass + '">' + p.st.toUpperCase() + '</span>' +
            '<span class="tag">' + requiredRatio + '</span>' +
          '</div>' +
        '</div>' +
        bar(r) +
        '<div class="mu row" style="gap:14px;margin-top:6px">' +
          '<span>Kabul: <b>' + r.y + '</b></span>' +
          '<span>Ret: <b>' + r.n + '</b></span>' +
          '<span>Katilim: <b>' + r.P + '/' + r.total + '</b></span>' +
          '<span>Oneren: <b>@' + esc(authorNick) + '</b></span>' +
        '</div>' +
        voteControls +
      '</div>';
    }).join('');

    return '<h2>Yururlukteki Oylamalar</h2>' + (propsHtml || '<p class="mu">Oylama bulunmuyor.</p>');
  },

  deleg: function(){
    var ex = S.users.filter(function(u){ return u.exp || u.ai; });
    var expertOpts = opts(ex.map(function(u){
      return [u.id, u.name + ' ' + u.sur + (u.ai ? ' (YZ)' : '') + ' - ' + on(u.exp)];
    }));

    var assignCard = me ? (
      '<div class="card">' +
        '<h3>Oyunu Devret</h3>' +
        '<div class="grid">' +
          '<div><label for="df">Alan</label><select id="df">' + ontoOpts() + '</select></div>' +
          '<div><label for="dt">Bilirkisi / YZ</label><select id="dt">' + expertOpts + '</select></div>' +
        '</div>' +
        '<button class="pri" onclick="assign()">Devret</button>' +
      '</div>'
    ) : '';

    var delegList = S.deleg.map(function(g, i){
      var fromUser = byId(g.from);
      var toUser = byId(g.to);
      var cancelBtn = (me && g.from === me.id) ? '<button onclick="S.deleg.splice(' + i + ',1);save();render()">Iptal</button>' : '';
      return '<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--ln)">' +
        '<div>@' + esc(fromUser ? fromUser.nick : '') + ' -&gt; @' + esc(toUser ? toUser.nick : '') + ' <span class="tag">' + esc(on(g.field)) + '</span></div>' +
        cancelBtn +
      '</div>';
    }).join('');

    return '<h2>Likit Demokrasi ve Delegasyon Grafi</h2>' +
      assignCard +
      '<div class="card">' +
        '<h3>Aktif Baglantilar</h3>' +
        (delegList || '<span class="mu">Baglanti yok.</span>') +
      '</div>';
  },

  ledger: function(){
    var entries = S.ledger.slice(-30).reverse().map(function(e){
      return '<div class="card" style="font-family:monospace;font-size:.85rem">' +
        '<b>Blok #' + e.n + ' [' + esc(e.a) + ']</b> <span class="mu">' + esc(e.t) + '</span><br>' +
        'Veri: <code>' + esc(JSON.stringify(e.d)) + '</code><br>' +
        'Hash: <code>' + e.h + '</code>' +
      '</div>';
    }).join('');

    return '<div class="row" style="justify-content:space-between;margin-bottom:10px">' +
      '<h2>Dagitik Defter</h2>' +
      '<button class="pri" onclick="verify()">Zinciri Dogrula</button>' +
    '</div>' +
    '<div class="scroll">' + entries + '</div>';
  },

  rules: function(){
    var ruleList = RULES.map(function(r){ return '<li>' + r + '</li>'; }).join('');
    var regList = REG.map(function(r){ return '<li>' + r + '</li>'; }).join('');
    var ontoList = S.onto.map(function(o){
      var level = anc(o.id).length - 1;
      return '<div class="ind" style="--d:' + level + '">- ' + esc(o.n) + '</div>';
    }).join('');

    return '<h2>Degismez Ilkeler</h2>' +
      '<ol>' + ruleList + '</ol>' +
      '<h2>Yonetmelik</h2>' +
      '<ul>' + regList + '</ul>' +
      '<h2>Ontoloji</h2>' +
      '<div class="card">' + ontoList + '</div>';
  }
};

function render(){
  var ch = S.ledger.slice(-32).map(function(e){
    var hue = parseInt(e.h.slice(0, 3), 16) % 360;
    return '<i style="background:hsl(' + hue + ' 50% 45%)" title="#' + e.n + ' ' + e.a + '"></i>';
  }).join('');

  var navButtons = Object.keys(TABS).map(function(k){
    return '<button class="' + (tab === k ? 'on' : '') + '" onclick="tab=\'' + k + '\';msg=[];open=null;render()">' + TABS[k] + '</button>';
  }).join('');

  var msgHtml = msg.length > 0 ? '<div class="msg">' + msg.map(esc).join('<br>') + '</div>' : '';

  $('#app').innerHTML =
    '<h1>Ortak Karar Forumu</h1>' +
    '<div class="mu">' + (me ? 'Oturum: @' + esc(me.nick) : 'Misafir') + '</div>' +
    '<div class="chain">' + ch + '</div>' +
    '<nav>' + navButtons + '</nav>' +
    msgHtml +
    V[tab]();
}

async function init(){
  var s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch(e){}

  if(!s){
    var salt = 'demo_salt';
    var H = await sha(salt + 'demo12345');
    var mk = function(id, n, sur, nick, intArr, extra){
      var obj = {
        id: id,
        name: n,
        sur: sur,
        birth: '2001-01-01',
        addr: 'Ankara',
        nick: nick,
        salt: salt,
        ph: H,
        demo: 1,
        int: intArr
      };
      if(extra){
        Object.keys(extra).forEach(function(k){ obj[k] = extra[k]; });
      }
      return obj;
    };

    s = {
      onto: [
        ['edu', 'Egitim', 0], ['uni', 'Universite', 'edu'], ['cls', 'Sinif', 'uni'],
        ['spor', 'Spor', 0], ['fb', 'Futbol', 'spor'], ['tek', 'Teknoloji', 0],
        ['yaz', 'Yazilim', 'tek'], ['egl', 'Eglence', 0], ['oyun', 'Oyunlar', 'egl'], ['diger', 'Diger', 0]
      ].map(function(a){ return { id: a[0], n: a[1], p: a[2] || null }; }),

      users: [
        mk('u1', 'Revan', 'Yusifli', 'revan', ['uni', 'cls', 'tek', 'yaz', 'oyun']),
        mk('u2', 'Mert', 'Aydin', 'mert', ['spor', 'fb', 'egl', 'oyun']),
        mk('u3', 'Zeynep', 'Kaya', 'zeynep', ['edu', 'uni', 'yaz', 'tek']),
        mk('u4', 'Can', 'Demir', 'can', ['uni', 'cls', 'oyun']),
        mk('n1', 'Nijat', 'Aliyev', 'nijat', ['egl', 'oyun', 'fb', 'spor']),
        mk('n2', 'Osman', 'Muradov', 'osman', ['egl', 'oyun', 'yaz', 'tek']),
        mk('n4', 'Maqa', 'Mammadov', 'maqa', ['egl', 'oyun', 'spor', 'cls']),
        mk('e1', 'Prof. Ayse', 'Kaya', 'ayse', ['spor', 'fb'], { exp: 'spor', demo: 0 }),
        mk('e2', 'Claude', 'Futbol-YZ', 'claude-futbol', ['spor', 'fb'], { exp: 'fb', ai: true, demo: 0 }),
        mk('e3', 'Dr. Tolga', 'Isik', 'tolga', ['tek', 'yaz'], { exp: 'tek', demo: 0 })
      ],
      topics: [],
      props: [],
      deleg: [],
      ledger: []
    };

    var T = function(id, title, parent, field, body, by){
      by = by || 'u1';
      s.topics.push({
        id: id,
        title: title,
        parent: parent,
        field: field,
        status: 'acik',
        hidden: false,
        by: by,
        parts: [{ id: id + 'p', t: body, by: by, hidden: false }]
      });
    };

    T('t1', 'Universite Karar Prensipleri', null, 'uni', 'Universite genel muzakere basligi.');
    T('t2', 'Kampuse Ucak Indirilmesi', 't1', 'uni', 'Universite genel yetkisindedir.');
    T('t3', 'Ders Sirasinda Telefon Kullanimi', 't2', 'cls', 'Sinif ici kurallar.');
    T('t4', 'Futbolda VAR Kararlari', null, 'fb', 'Hali saha ligi kurallari.');
    T('t5', 'Kampus Etkinlikleri', null, 'egl', 'Ogrenci yarismalari.');

    s.deleg = [
      { from: 'u2', to: 'e2', field: 'fb' },
      { from: 'n1', to: 'e2', field: 'fb' },
      { from: 'u3', to: 'e3', field: 'yaz' }
    ];

    S = s;
    await log('sistem', { m: 'Kuruldu' });

    var p1 = { id: 'pr1', type: 'edit', pl: { tid: 't4', body: 'VAR itirazi azami 60 saniyedir.' }, by: 'u2', votes: { u2: 'e', n1: 'e', e2: 'e' }, st: 'acik', t: Date.now() - 7200000 };
    s.props.push(p1);
    await log('oneri:edit', { p: p1.id, by: 'mert' });
    await fin(p1.id, true);

    var p2 = { id: 'pr2', type: 'create', pl: { title: 'Kampus Domino Turnuvasi', body: 'Kulup ici turnuva.', parent: 't5', field: 'oyun' }, by: 'n1', votes: { n1: 'e', n2: 'e', u1: 'e', u4: 'e', maqa: 'h' }, st: 'acik', t: Date.now() - 3600000 };
    s.props.push(p2);
    await log('oneri:create', { p: p2.id, by: 'nijat' });
    await fin(p2.id, true);

    save();
  }

  S = s;
  var savedUser = localStorage.getItem(SESS);
  me = savedUser ? byId(savedUser) : S.users[0];
  render();
}

init();
</script>
